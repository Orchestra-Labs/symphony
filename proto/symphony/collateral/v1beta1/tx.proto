syntax = "proto3";
package symphony.collateral.v1beta1;

option go_package = "github.com/osmosis-labs/osmosis/v27/x/collateral/types";

import "cosmos/base/v1beta1/coin.proto";
import "cosmos/tx/v1beta1/tx.proto";
import "google/protobuf/any.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "cosmos/msg/v1/msg.proto";


service Msg {
  rpc Deposit(MsgDeposit) returns (MsgDepositResponse) {
    option (google.api.http) = {
      post: "/symphony/collateral/v1beta1/deposit"
      body: "*"
    };

  };

  rpc Withdraw(MsgWithdraw) returns (MsgWithdrawResponse){
    option (google.api.http) = {
      post: "/symphony/collateral/v1beta1/withdraw"
      body: "*"
    };
  };
}



message MsgDeposit {
  option (gogoproto.equal) = false;
  option (gogoproto.goproto_getters) = false;
  option (cosmos.msg.v1.signer) = "sender";

  string sender = 1 [
    (gogoproto.moretags) = "yaml:\"sender\"",
    (cosmos_proto.scalar) = "cosmos.AddressString"
  ];
  cosmos.base.v1beta1.Coin amount = 2 [
    (gogoproto.moretags) = "yaml:\"amount\"",
    (gogoproto.nullable) = false
  ];
}

message MsgDepositResponse {
  string receiver = 1 [
    (gogoproto.moretags) = "yaml:\"receiver\"",
    (cosmos_proto.scalar) = "cosmos.AddressString"
  ];
  cosmos.base.v1beta1.Coin tracking_amount = 2 [
    (gogoproto.moretags) = "yaml:\"tracking_amount\"",
    (gogoproto.nullable) = false
  ];
}

message MsgWithdraw {
  option (gogoproto.equal) = false;
  option (gogoproto.goproto_getters) = false;
  option (cosmos.msg.v1.signer) = "sender";

  string sender = 1 [
    (gogoproto.moretags) = "yaml:\"sender\"",
    (cosmos_proto.scalar) = "cosmos.AddressString"
  ];
  cosmos.base.v1beta1.Coin amount = 2 [
    (gogoproto.moretags) = "yaml:\"amount\"",
    (gogoproto.nullable) = false
  ];}

message MsgWithdrawResponse {
  string receiver = 1 [
    (gogoproto.moretags) = "yaml:\"receiver\"",
    (cosmos_proto.scalar) = "cosmos.AddressString"
  ];

  cosmos.base.v1beta1.Coin returned_amount = 2 [
    (gogoproto.moretags) = "yaml:\"returned_amount\""
  ];
}